# Chạy (Windows CMD: "chcp 65001" trước để gõ tiếng Việt):
#   docker compose build
#   docker compose up -d qdrant
#   docker compose run --rm rag index --steps chunk,embed,index       # dựng index (bắt buộc sau khi đổi mô hình embedding)
#   docker compose run --rm rag index --steps index                   # chỉ nạp lại Qdrant từ chunks.pkl + embedds.npy có sẵn
#   docker compose run --rm rag                                       # chat (mặc định: vi-qwen2-3b-rag 4-bit)
#   docker compose run --rm rag ask "Tóm tắt vụ 2 tàu đối đầu ở Quảng Nam"
#   docker compose run --rm rag questions --n 10 --eval
#   docker compose run --rm rag evaluate --rescore
#   docker compose run --rm rag --help
#
# Vistral-7B-Chat (GGUF) chạy bằng llama-server trên MÁY HOST, container gọi qua host.docker.internal:8080:
#   tools\llama-cpp\llama-server -m models\Vistral-7B-ChatML.i1-Q4_K_M.gguf -ngl 99 -c 8192 --port 8080 --host 0.0.0.0
#   docker compose run --rm rag chat --llm vistral-7b-chat
#
# So sánh LLM trên bộ benchmark 100 câu (OUTPUT_QUESTIONS/compare100/questions.jsonl):
#   docker compose run --rm rag --questions-dir OUTPUT_QUESTIONS/compare100 contexts   # truy xuất 1 lần -> contexts.jsonl
#   docker compose run --rm rag --questions-dir OUTPUT_QUESTIONS/compare100 answer --llm qwen2.5-3b
#   docker compose run --rm rag --questions-dir OUTPUT_QUESTIONS/compare100 answer --llm vi-qwen2-3b-rag
#   docker compose --profile llm5 run --rm llm5 --questions-dir OUTPUT_QUESTIONS/compare100 answer --llm qwen3.5-2b-vie
#   docker compose run --rm rag --questions-dir OUTPUT_QUESTIONS/compare100 report      # -> compare_report.md / .csv
#   docker compose run --rm rag --questions-dir OUTPUT_QUESTIONS/compare100 judge       # -> judge_<llm>/report.md

services:
  rag:
    build: .
    image: text_summarization
    stdin_open: true   # để gõ câu hỏi trong terminal
    tty: true
    environment:
      - RAG_QDRANT_URL=http://qdrant:6333         # bỏ dòng này để dùng Qdrant nhúng (OUTPUT_INDEX/qdrant, dựng bằng: index --steps index)
      - RAG_LLAMA_URL=http://host.docker.internal:8080   # llama-server trên máy host (cho vistral-7b-chat)
    extra_hosts:
      - "host.docker.internal:host-gateway"       # Linux cần dòng này; Docker Desktop đã có sẵn
    depends_on:
      - qdrant
    volumes:
      - ./OUTPUT_LOAD:/app/OUTPUT_LOAD            # data_article.json
      - ./OUTPUT_INDEX:/app/OUTPUT_INDEX          # entities.json, vectors/{chunks.pkl, embedds.npy}
      - ./OUTPUT_QUESTIONS:/app/OUTPUT_QUESTIONS  # câu hỏi sinh ra + kết quả chấm
      - hf_cache:/root/.cache/huggingface         # mô hình tải 1 lần, dùng lại
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qdrant:             # kho vector (dense + BM25). Lần đầu: docker compose run --rm rag index --steps chunk,embed,index
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  llm5:               # chỉ chạy bước answer cho LLM cần transformers ≥ 5.2
    profiles: [llm5]
    build:
      context: .
      dockerfile: Dockerfile.llm5
    image: text_summarization-llm5
    volumes:
      - ./OUTPUT_QUESTIONS:/app/OUTPUT_QUESTIONS
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf_cache:
  qdrant_data:
