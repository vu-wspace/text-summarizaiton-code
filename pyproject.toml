[project]
name = "vietnews-rag"
version = "0.2.0"
description = "VietNews: tóm tắt (ViT5) + NER (ELECTRA) + hỏi đáp RAG (vietnamese-bi-encoder, Qdrant hybrid, Vietnamese_Reranker, LLM tiếng Việt)"
requires-python = ">=3.11,<3.13"
dependencies = [
    # nền tảng — ghim để máy local khớp với Kaggle
    "torch==2.8.0",
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3",
    "pyarrow",
    "huggingface_hub>=0.30,<1",
    # mô hình
    "transformers>=4.56,<5",          # <5: transformers 5 làm hỏng tokenizer ViT5
    "sentence-transformers>=5.0,<6",  # CrossEncoder cho re-ranker
    "accelerate",                     # device_map='auto' khi nạp LLM
    "sentencepiece",                  # tokenizer ViT5
    "protobuf",
    "jinja2>=3.1.0",                  # chat template của Qwen
    "bitsandbytes>=0.46.1",           # LLM 4-bit (cần GPU NVIDIA)
    "pyvi>=0.1.1",                    # tách từ cho vietnamese-bi-encoder (PhoBERT)
    # RAG
    "langchain-core>=0.3,<1",
    "langchain-text-splitters>=0.3,<1",
    "qdrant-client>=1.12",            # kho vector: dense + BM25 (hybrid RRF)
    "tqdm",
]

[project.scripts]
vietnews = "text_summarization.cli:main"   # uv run vietnews chat --llm-4bit

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_summarization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

# Lấy torch bản CUDA từ index của PyTorch.
#   cu128: bắt buộc cho RTX 50xx (máy hiện tại), chạy được cả RTX 20/30/40
#   cu126: RTX 20/30/40 với driver cũ hơn
#   cpu  : máy không có GPU NVIDIA
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "SIM", "RET", "PIE"]
ignore = ["B905"]   # zip(strict=) không cần: các danh sách luôn cùng độ dài theo cấu trúc

[tool.ruff.lint.isort]
known-first-party = ["text_summarization"]
